<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#5a3d8a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- macOS Big Sur rounded rect -->
  <rect x="128" y="128" width="768" height="768" rx="184" ry="184" fill="url(#bg)"/>
  <rect x="128" y="128" width="768" height="768" rx="184" ry="184" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="4"/>

  <!-- Claude-inspired spiral / swirl -->
  <g transform="translate(512, 512)" filter="url(#glow)">
    <!-- Main spiral body -->
    <path d="M0,-200
             C110,-200 200,-110 200,0
             C200,110 110,200 0,200
             C-90,200 -160,140 -160,60
             C-160,-10 -110,-60 -50,-60
             C-10,-60 20,-30 20,10
             C20,40 0,60 -30,60
             C-55,60 -75,40 -75,15
             C-75,-5 -60,-20 -40,-20"
          fill="none"
          stroke="#ffffff"
          stroke-width="48"
          stroke-linecap="round"/>

    <!-- Inner accent for depth -->
    <path d="M0,-200
             C110,-200 200,-110 200,0
             C200,110 110,200 0,200
             C-90,200 -160,140 -160,60
             C-160,-10 -110,-60 -50,-60
             C-10,-60 20,-30 20,10
             C20,40 0,60 -30,60
             C-55,60 -75,40 -75,15
             C-75,-5 -60,-20 -40,-20"
          fill="none"
          stroke="rgba(255,255,255,0.25)"
          stroke-width="16"
          stroke-linecap="round"/>
  </g>
</svg>